name: Windows 2.2 release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - wechat_archive/**
      - tools/**
      - tests/**
      - packaging/**
      - .github/workflows/release-windows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install fixed build dependencies
        run: |
          python -m pip install . "PyInstaller==6.22.3" "Pillow==12.3.0" "wechatauto-replica==1.2.6.1" "cryptography==50.0.2" "zstandard==0.25.0"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Restore synthetic fixtures and verify image contracts
        run: |
          python -B -X utf8 tools/prepare_fixtures.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 -m unittest discover -s tests -p test_locale_ui.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 -m unittest discover -s tests -p test_account_labels.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 -m unittest discover -s tests -p test_release_220.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 -m unittest discover -s tests -p test_release_221.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -X utf8 -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare fixed official runtime
        run: python -B -X utf8 tools/prepare_codex_runtime.py build/codex_runtime
      - name: Build Windows application
        run: python -B -X utf8 -m PyInstaller --noconfirm --distpath build/release --workpath build/pyinstaller packaging/windows.spec
      - name: Verify the packaged executable
        run: |
          $program = (Resolve-Path -LiteralPath 'build/release/Sixu/思绪.exe').Path
          $checks = @(
            @('--smoke-check', 'examples/chat_sample.json', '--check-dir', 'build/check-desktop'),
            @('--codex-check-dir', 'build/check-codex'),
            @('--knowledge-check-dir', 'build/check-knowledge'),
            @('--sixu-check-dir', 'build/check-sixu'),
            @('--workbench-check-dir', 'build/check-workbench')
          )
          foreach ($check in $checks) {
            $process = Start-Process -FilePath $program -ArgumentList $check -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Packaged check failed: $($check[0]) ($($process.ExitCode))" }
          }
      - name: Create verified release archive
        run: |
          python -B -X utf8 tools/package_ci_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Sixu-2.2.1-Windows-x64
          path: |
            build/Sixu-2.2.1-Windows-x64.zip
            build/SHA256SUMS.txt
      - name: Publish 2.2.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.2.1 build/Sixu-2.2.1-Windows-x64.zip build/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "思绪 2.2.1" --notes-file docs/SIXU_2_2_1_RELEASE.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
